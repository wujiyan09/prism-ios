name: ICT
options:
  fileTypes:
    icon:
      file: true
      buildPhase: resources
  bundleIdPrefix: com.wujiyan09
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
targets:
  ICT:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftMath
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "AppIcon.icon/**"
          - "data/book-*.json"
          - "data/dse-*.json"
          - "data/manifest.json"
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wujiyan09.nodus
        PRODUCT_NAME: ICT
        APP_DISPLAY_NAME: Nodus
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NODUS"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: NodusIcon
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
  # Nodus: notes-only app from the same sources (compiled with NODUS). Bundle ID / icon / name differ.
  Nodus:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftMath
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "AppIcon.icon/**"
          - "data/book-*.json"
          - "data/dse-*.json"
          - "data/manifest.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wujiyan09.nodus
        PRODUCT_NAME: Nodus
        APP_DISPLAY_NAME: Nodus
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NODUS"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: NodusIcon
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
  PrismUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ICT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wujiyan09.prism.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ICT
schemes:
  ICT:
    build:
      targets:
        ICT: all
    test:
      targets:
        - PrismUITests
  Nodus:
    build:
      targets:
        Nodus: all
